<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="styles.css" />
    <script src="Aluno.js" defer></script>
    <script src="Turma.js" defer></script>
    <script src="Interface.js" defer></script>
    <script src="Main.js" defer></script>

    <title>Sistema escolar POO</title>
  </head>
  <body>
    <!-- Botões para trocar de aba -->
    <div class="tabs-container">
      <button
        class="tab-button active"
        id="btn-cadastrar"
        onclick="cadastroAluno()"
      >
        Cadastrar
      </button>
      <button class="tab-button" id="btn-listar" onclick="listarAluno()">
        Listar Alunos
      </button>
      <button class="tab-button" id="btn-listar-turma" onclick="listarTurma()">
        Listar Turmas
      </button>
      <button
        class="tab-button"
        id="btn-cadastrar-turma"
        onclick="cadastrarTurma()"
      >
        Cadastrar Turmas
      </button>
    </div>

    <!-- Conteúdo da Aba 1: Listar Turma -->
    <div id="tab-listar-turma" class="tab-content">
      <h3>Turmas Cadastradas</h3>
      <ul class="listar-turma" id="listar-turma">
        <!-- O JavaScript vai colocar as turmas aqui depois -->
        <li>Nenhuma turma cadastrada ainda.</li>
      </ul>
    </div>

    <!-- Conteúdo da Aba 2: cadastrar turma -->
    <div id="tab-cadastrar-turma" class="tab-content">
      Professor: <input id="professor" type="text" /> Nome do curso:
      <input id="nomeCurso" type="text" />

      <button onclick="bntSalvarTurma()" class="btn-salvar">
        Salvar Turma
      </button>
    </div>

    <!-- Conteúdo da Aba 3: Cadastrar -->
    <div id="tab-cadastrar" class="tab-content active">
      Nome: <input id="nome" type="text" /> Nota 1:
      <input id="n1" type="text" /> Nota 2: <input id="n2" type="text" /> Nota
      3: <input id="n3" type="text" />
      <select id="meuSelect">
        <option value="">Selecione uma turma...</option>
      </select>
      <button onclick="btnSalvar()" class="btn-salvar">Salvar Aluno</button>
    </div>

    <!-- Conteúdo da Aba 4: Listar -->
    <div id="tab-listar" class="tab-content">
      <h3>Alunos Cadastrados</h3>
      <ul class="lista-alunos" id="alunos">
        <!-- O JavaScript vai colocar os alunos aqui depois -->
        <li>Nenhum aluno cadastrado ainda.</li>
      </ul>
    </div>

    <!-- Modal para editar as notas do aluno -->
    <div
      id="modal-editar-nota"
      class="modal-overlay"
      onclick="if (event.target === this) Interface.fecharModalEdicao()"
    >
      <div class="modal-box">
        <h3>Alterar Notas</h3>
        <p class="modal-subtitulo" id="edit-aluno-nome"></p>

        <div class="modal-campo">
          <label for="edit-n1">Nota 1:</label>
          <input id="edit-n1" type="number" step="0.1" />
        </div>

        <div class="modal-campo">
          <label for="edit-n2">Nota 2:</label>
          <input id="edit-n2" type="number" step="0.1" />
        </div>

        <div class="modal-campo">
          <label for="edit-n3">Nota 3:</label>
          <input id="edit-n3" type="number" step="0.1" />
        </div>

        <div class="modal-acoes">
          <button
            type="button"
            class="btn-modal-cancelar"
            onclick="Interface.fecharModalEdicao()"
          >
            Cancelar
          </button>
          <button
            type="button"
            class="btn-modal-salvar"
            onclick="Interface.salvarEdicaoNota()"
          >
            Salvar Notas
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
